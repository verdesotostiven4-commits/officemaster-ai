<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OfficeMaster AI</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <div class="brand">OfficeMaster AI</div>
      <div class="tag">Crea • Edita • Descarga</div>
    </nav>

    <main class="app">
      <section class="card hero">
        <div>
          <div class="badge" id="badge">Word Studio</div>
          <h1>Documentos profesionales con <span class="accent">IA</span>.</h1>
          <p>Genera Word, PowerPoint y Excel en una experiencia compacta, clara y con pasos visibles de trabajo.</p>
        </div>
        <div class="progressBox">
          <b>Proceso en vivo</b>
          <div class="steps" id="steps"></div>
        </div>
      </section>

      <section class="card studio">
        <div class="tabs">
          <button class="tab on" data-t="word">Word</button>
          <button class="tab" data-t="ppt">PPT</button>
          <button class="tab" data-t="excel">Excel</button>
          <button class="tab" data-t="auto">Auto</button>
        </div>

        <input id="title" value="Documento profesional">
        <div class="row">
          <select id="style"><option>Profesional</option><option>Académico</option><option>Escolar</option><option>Negocio</option></select>
          <select id="level"><option>Completo</option><option>Resumido</option><option>Avanzado</option></select>
        </div>
        <textarea id="prompt">Hazme una presentación profesional sobre turismo en Galápagos con 8 diapositivas.</textarea>
        <div class="actions">
          <button class="primary" id="make">Generar</button>
          <button class="ghost" id="down">Descargar</button>
        </div>
        <div class="ideas" id="ideas"></div>
      </section>

      <section class="card preview">
        <div>
          <b>Vista previa</b>
          <p id="kind">Documento Word</p>
        </div>
        <div class="screen"><pre id="out"></pre></div>
        <div class="mini"><span>.docx</span><span>.pptx</span><span>.xlsx</span></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast">Listo</div>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
